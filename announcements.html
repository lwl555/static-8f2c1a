<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>公告 · 私信助手</title>
<style>
  :root{--ink:#111418;--sub:#6b7280;--line:#e5e7eb;--bg:#f7f8f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:20px 14px 70px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:12.5px;margin-bottom:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
  input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:8px}
  textarea{min-height:70px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .item{border-bottom:1px solid #f0f2f3;padding:10px 0}
  .item b{font-size:14px}
  .item .m{color:var(--sub);font-size:12px}
  .hint{color:var(--sub);font-size:12px}
  .err{color:#a33b2c;font-size:12.5px}
  .hidden{display:none}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
  .field input{margin-bottom:0}
  .two{display:flex;gap:8px;flex-wrap:wrap}
  .two>.field{flex:1 1 200px;min-width:180px}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-right:6px;font-size:11.5px;color:var(--sub);background:#fafbfb}
  .tag.brand{color:#31506e;border-color:#cfe0ee;background:#f2f8fd}
</style>
</head>
<body>
<div class="wrap">
  <h1>公告</h1>
  <div class="sub">App 心跳拉取，回到前台弹一次（按 id 记已读）。停用后不再下发。</div>
  <div class="sub" style="margin-top:6px">导航：
    <a href="index.html">设备台</a> ·
    <a href="params.html">参数中心</a> ·
    <a href="rules.html">判定规则</a> ·
    <a href="selectors.html">选择器</a> ·
    <a href="announcements.html">公告</a>
  </div>

  <div class="card" id="loginCard">
    <div style="font-weight:600;margin-bottom:8px">管理员登录</div>
    <input id="email" value="18882632073" placeholder="管理员账号（手机号）">
    <input id="pass" type="password" placeholder="密码">
    <div class="row"><button class="primary" onclick="login()">登录</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="hidden" id="editCard">
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">新建公告</div>
      <input id="title" placeholder="标题">
      <textarea id="body" placeholder="正文（纯文本）"></textarea>
      <select id="severity">
        <option value="info">info · 顶部提示（可关）</option>
        <option value="important">important · 弹一次</option>
        <option value="critical">critical · 强制（谨慎）</option>
      </select>
      <select id="platform">
        <option value="android" selected>android · 仅安卓</option>
        <option value="all">all · 全平台</option>
        <option value="ios">ios · 仅 iOS</option>
      </select>
      <div class="two">
        <div class="field"><label>最低版本（留空=不限）</label><input id="minv" placeholder="如 0.7.0"></div>
        <div class="field"><label>最高版本（留空=不限）</label><input id="maxv" placeholder="如 0.9.9"></div>
      </div>
      <div class="field"><label>品牌名单（可空，逗号分隔，不区分大小写）</label><input id="brands" placeholder="如 OnePlus,Xiaomi"></div>
      <div class="two">
        <div class="field"><label>生效开始（留空 = 立即生效）</label><input id="startAt" type="datetime-local"></div>
        <div class="field"><label>生效结束（留空 = 长期有效）</label><input id="endAt" type="datetime-local"></div>
      </div>
      <input id="action" placeholder="跳转链接（可空）">
      <div class="row"><button class="primary" onclick="create()">发布</button>
      <a href="index.html" style="margin-left:auto;color:var(--sub);font-size:12.5px;align-self:center">返回设备列表</a></div>
      <div class="hint" id="msg"></div>
      <div class="err" id="err"></div>
      <div class="hint" style="margin-top:6px">品牌与版本/时间只影响下发条件：品牌名单以 <code>[brands:...]</code> 标记追加在正文末尾，不新增数据库字段。</div>
      <div class="hint" style="margin-top:6px">发布后：手机 App 开着的话 3 秒内就会弹；没开的话下次打开 App 或下一次心跳（约 1 分钟）后弹。每条公告在每台设备上只弹一次。</div>
    </div>
    <div class="card" id="listCard"><div class="hint">加载中…</div></div>
  </div>
</div>
<script>
/* v0.8.0：账号支持直接填手机号，自动补内部域名，兼容填完整邮箱 */
function normAccount(v){
  v = (v || '').trim();
  return (v && v.indexOf('@') < 0) ? v + '@linyu.local' : v;
}

const SUPA='https://console-8f2c1a.pages.dev/api/supa';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbnNzeWlxaXR1Z3FmbWNiZGhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDEyNzUsImV4cCI6MjA5ODk3NzI3NX0.9EfbEr7BQhZtbOwHJ3IrkOy16kcaxlmzuJuV0A2Z8Eg';
let token=sessionStorage.getItem('dm_token')||'';

const BRAND_RE=/\[brands:([^\]]*)\]\s*$/i;
function val(id){ const el=document.getElementById(id); return el?String(el.value==null?'':el.value):''; }
function txt(id){ return val(id).trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* 正文末尾的品牌标记：解析出来展示，写库时不新增字段 */
function parseBrands(body){
  const s=String(body==null?'':body);
  const m=s.match(BRAND_RE);
  if(!m) return {text:s, list:[]};
  const list=String(m[1]||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  return {text:s.slice(0,m.index).replace(/\s+$/,''), list};
}
function stripBrandMarker(s){ return String(s==null?'':s).replace(/\[brands:[^\]]*\]\s*$/i,'').replace(/\s+$/,''); }
function brandList(raw){
  const seen={}, out=[];
  String(raw==null?'':raw).split(/[,，]/).forEach(function(x){
    const k=x.replace(/[\[\]]/g,'').trim();
    if(!k) return;
    const key=k.toLowerCase();
    if(seen[key]) return;
    seen[key]=1; out.push(k);
  });
  return out;
}
/* datetime-local -> timestamptz（UTC ISO），空/非法一律 null */
function toIso(v){
  const s=String(v==null?'':v).trim();
  if(!s) return null;
  const d=new Date(s);
  return isNaN(d.getTime())?null:d.toISOString();
}
function fmtTime(v){
  const s=String(v==null?'':v).trim();
  if(!s) return '';
  const d=new Date(s);
  return isNaN(d.getTime())?s:d.toLocaleString('zh-CN');
}
function verRange(a){
  const lo=String((a&&a.min_version)||'').trim(), hi=String((a&&a.max_version)||'').trim();
  if(lo&&hi) return lo+' ~ '+hi;
  if(lo) return '≥ '+lo;
  if(hi) return '≤ '+hi;
  return '全版本';
}
function whenRange(a){
  const s=fmtTime(a&&a.start_at), e=fmtTime(a&&a.end_at);
  if(!s&&!e) return '不限时间';
  if(s&&e) return s+' ~ '+e;
  return s? s+' 起生效' : e+' 前有效';
}
function platformLabel(v){
  const p=String(v==null?'':v).trim().toLowerCase();
  if(!p) return '—';
  if(p==='android') return 'android';
  if(p==='ios') return 'ios';
  if(p==='all') return 'all';
  return p;
}
/* 公告现在到底会不会下发：这是最容易踩的坑——以前 start_at 留空会被后端当「未生效」直接吞掉 */
function statusOf(a){
  a = a || {};
  if(!a.enabled) return {k:'off', t:'已停用 · 不下发'};
  const now = Date.now();
  const s = a.start_at ? new Date(a.start_at).getTime() : null;
  const e = a.end_at ? new Date(a.end_at).getTime() : null;
  if(s && !isNaN(s) && now < s) return {k:'wait', t:'未生效 · ' + fmtTime(a.start_at) + ' 起'};
  if(e && !isNaN(e) && now > e) return {k:'over', t:'已过期 · ' + fmtTime(a.end_at) + ' 止'};
  return {k:'live', t:'生效中 · 会下发'};
}
const STATUS_COLOR = {live:'#1a7f4b', wait:'#8a6d1f', over:'#6b7280', off:'#6b7280'};

async function api(path,opt){
  const r=await fetch(SUPA+path,Object.assign({},opt,{headers:Object.assign({apikey:ANON,Authorization:'Bearer '+token,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  const t=await r.text(); if(!r.ok) throw new Error(t.slice(0,180));
  return t?JSON.parse(t):[];
}
async function login(){
  const err=document.getElementById('loginErr'); err.textContent='';
  try{
    const r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email:normAccount(document.getElementById('email').value.trim()),password:document.getElementById('pass').value})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||'登录失败');
    token=j.access_token; sessionStorage.setItem('dm_token',token); show();
  }catch(e){ err.textContent='登录失败：'+e.message; }
}
function show(){ document.getElementById('loginCard').classList.add('hidden'); document.getElementById('editCard').classList.remove('hidden'); load(); }
async function load(){
  const card=document.getElementById('listCard');
  try{
    const rows=await api('/rest/v1/dm_announcements?select=*&order=id.desc&limit=50');
    if(!rows||!rows.length){ card.innerHTML='<div class="hint">还没有公告</div>'; return; }
    card.innerHTML = rows.map(function(a){
      const p=parseBrands(a&&a.body);
      const st=statusOf(a||{});
      const tags=['平台：'+platformLabel(a&&a.platform),'版本：'+verRange(a||{})];
      if(p.list.length) tags.push('品牌：'+p.list.join('、'));
      tags.push('生效：'+whenRange(a||{}));
      return `<div class="item"><b>${esc(a&&a.title)}</b>
      <div class="m"><span style="color:${STATUS_COLOR[st.k]||'#6b7280'};font-weight:600">${esc(st.t)}</span>
        · #${esc(a&&a.id)} · ${esc((a&&a.severity)||'info')} · ${esc(fmtTime(a&&a.created_at)||'—')}</div>
      <div class="m">${tags.map(t=>`<span class="tag${t.indexOf('品牌：')===0?' brand':''}">${esc(t)}</span>`).join('')}</div>
      <div class="m">${esc(p.text.slice(0,80))||'（无正文）'}</div>
      <div class="row"><button onclick="toggle(${esc(a&&a.id)},${a&&a.enabled?'false':'true'})">${a&&a.enabled?'停用':'启用'}</button>
      <button onclick="del(${esc(a&&a.id)})">删除</button></div></div>`;
    }).join('');
  }catch(e){ card.innerHTML='<div class="err">读取失败：'+esc(e.message)+'</div>'; }
}
async function create(){
  const msg=document.getElementById('msg'),err=document.getElementById('err'); err.textContent='';
  const title=txt('title');
  if(!title){ err.textContent='标题不能空'; return; }
  const startAt=toIso(val('startAt')), endAt=toIso(val('endAt'));
  if(startAt&&endAt&&new Date(endAt).getTime()<=new Date(startAt).getTime()){ err.textContent='结束时间必须晚于开始时间'; return; }
  const brands=brandList(val('brands'));
  const bodyRaw=stripBrandMarker(val('body'));
  const body=brands.length ? (bodyRaw?bodyRaw+'\n':'')+'[brands:'+brands.join(',')+']' : bodyRaw;
  const platform=txt('platform')||'android';
  msg.textContent='发布中…';
  try{
    await api('/rest/v1/dm_announcements',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({
      title:title, body:body, severity:txt('severity')||'info',
      platform:platform,
      min_version:txt('minv'), max_version:txt('maxv'),
      start_at:startAt, end_at:endAt,
      action_url:txt('action'), enabled:true, once:true
    })});
    msg.textContent='已发布';
    ['title','body','minv','maxv','brands','startAt','endAt','action'].forEach(function(id){
      const el=document.getElementById(id); if(el) el.value='';
    });
    document.getElementById('severity').value='info';
    document.getElementById('platform').value='android';
    load();
  }catch(e){ msg.textContent=''; err.textContent='失败：'+e.message; }
}
async function toggle(id,on){
  try{ await api('/rest/v1/dm_announcements?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({enabled:!!on})}); load(); }catch(e){ alert(e.message); }
}
async function del(id){
  if(!confirm('删除这条公告？')) return;
  try{ await api('/rest/v1/dm_announcements?id=eq.'+id,{method:'DELETE'}); load(); }catch(e){ alert(e.message); }
}
if(token) show();
</script>
</body>
</html>
