<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>公告 · 私信助手</title>
<style>
  :root{--ink:#111418;--sub:#6b7280;--line:#e5e7eb;--bg:#f7f8f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:20px 14px 70px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:12.5px;margin-bottom:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
  input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:8px}
  textarea{min-height:70px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .item{border-bottom:1px solid #f0f2f3;padding:10px 0}
  .item b{font-size:14px}
  .item .m{color:var(--sub);font-size:12px}
  .hint{color:var(--sub);font-size:12px}
  .err{color:#a33b2c;font-size:12.5px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>公告</h1>
  <div class="sub">App 心跳拉取，回到前台弹一次（按 id 记已读）。停用后不再下发。</div>

  <div class="card" id="loginCard">
    <div style="font-weight:600;margin-bottom:8px">管理员登录</div>
    <input id="email" value="admin@linyu.local" placeholder="管理员邮箱">
    <input id="pass" type="password" placeholder="密码">
    <div class="row"><button class="primary" onclick="login()">登录</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="hidden" id="editCard">
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">新建公告</div>
      <input id="title" placeholder="标题">
      <textarea id="body" placeholder="正文（纯文本）"></textarea>
      <select id="severity">
        <option value="info">info · 顶部提示（可关）</option>
        <option value="important">important · 弹一次</option>
        <option value="critical">critical · 强制（谨慎）</option>
      </select>
      <input id="minv" placeholder="最低版本（可空，如 0.7.0）">
      <input id="action" placeholder="跳转链接（可空）">
      <div class="row"><button class="primary" onclick="create()">发布</button>
      <a href="index.html" style="margin-left:auto;color:var(--sub);font-size:12.5px;align-self:center">返回设备列表</a></div>
      <div class="hint" id="msg"></div>
      <div class="err" id="err"></div>
    </div>
    <div class="card" id="listCard"><div class="hint">加载中…</div></div>
  </div>
</div>
<script>
const SUPA='https://console-8f2c1a.pages.dev/api/supa';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbnNzeWlxaXR1Z3FmbWNiZGhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDEyNzUsImV4cCI6MjA5ODk3NzI3NX0.9EfbEr7BQhZtbOwHJ3IrkOy16kcaxlmzuJuV0A2Z8Eg';
let token=sessionStorage.getItem('dm_token')||'';

async function api(path,opt){
  const r=await fetch(SUPA+path,Object.assign({},opt,{headers:Object.assign({apikey:ANON,Authorization:'Bearer '+token,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  const t=await r.text(); if(!r.ok) throw new Error(t.slice(0,180));
  return t?JSON.parse(t):[];
}
async function login(){
  const err=document.getElementById('loginErr'); err.textContent='';
  try{
    const r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('pass').value})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||'登录失败');
    token=j.access_token; sessionStorage.setItem('dm_token',token); show();
  }catch(e){ err.textContent='登录失败：'+e.message; }
}
function show(){ document.getElementById('loginCard').classList.add('hidden'); document.getElementById('editCard').classList.remove('hidden'); load(); }
async function load(){
  const card=document.getElementById('listCard');
  try{
    const rows=await api('/rest/v1/dm_announcements?select=*&order=id.desc&limit=50');
    card.innerHTML = rows.length ? rows.map(a=>`<div class="item"><b>${esc(a.title)}</b>
      <div class="m">#${a.id} · ${a.severity} · ${a.enabled?'启用':'停用'} · ${a.min_version||'全版本'} · ${new Date(a.created_at).toLocaleString('zh-CN')}</div>
      <div class="m">${esc((a.body||'').slice(0,80))}</div>
      <div class="row"><button onclick="toggle(${a.id},${!a.enabled})">${a.enabled?'停用':'启用'}</button>
      <button onclick="del(${a.id})">删除</button></div></div>`).join('') : '<div class="hint">还没有公告</div>';
  }catch(e){ card.innerHTML='<div class="err">读取失败：'+esc(e.message)+'</div>'; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function create(){
  const msg=document.getElementById('msg'),err=document.getElementById('err'); err.textContent='';
  const title=document.getElementById('title').value.trim();
  if(!title){ err.textContent='标题不能空'; return; }
  msg.textContent='发布中…';
  try{
    await api('/rest/v1/dm_announcements',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({
      title, body:document.getElementById('body').value, severity:document.getElementById('severity').value,
      min_version:document.getElementById('minv').value.trim(), action_url:document.getElementById('action').value.trim(), enabled:true, once:true
    })});
    msg.textContent='已发布'; document.getElementById('title').value=''; document.getElementById('body').value='';
    load();
  }catch(e){ msg.textContent=''; err.textContent='失败：'+e.message; }
}
async function toggle(id,on){
  try{ await api('/rest/v1/dm_announcements?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({enabled:!!on})}); load(); }catch(e){ alert(e.message); }
}
async function del(id){
  if(!confirm('删除这条公告？')) return;
  try{ await api('/rest/v1/dm_announcements?id=eq.'+id,{method:'DELETE'}); load(); }catch(e){ alert(e.message); }
}
if(token) show();
</script>
</body>
</html>
