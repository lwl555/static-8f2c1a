<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>判定规则 · 私信助手</title>
<style>
  :root{--ink:#111418;--sub:#6b7280;--line:#e5e7eb;--bg:#f7f8f9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:12.5px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
  textarea{width:100%;min-height:380px;font:12.5px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hint{color:var(--sub);font-size:12px}
  .err{color:#a33b2c;font-size:12.5px;margin-top:8px}
  input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>判定规则</h1>
  <div class="sub">改完保存，App 下一轮心跳自动拉取，不用发版。规则按 priority 从大到小，第一条命中即执行。</div>

  <div class="card" id="loginCard">
    <div style="font-weight:600;margin-bottom:8px">管理员登录</div>
    <input id="email" placeholder="管理员邮箱" value="admin@linyu.local">
    <input id="pass" type="password" placeholder="密码">
    <div class="row"><button class="primary" onclick="login()">登录</button></div>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="card hidden" id="editCard">
    <textarea id="rules" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" onclick="save()">保存并下发</button>
      <button onclick="check()">只校验 JSON</button>
      <button onclick="dryRun()">试运行（最近 100 条会话）</button>
      <button onclick="load()">重新拉取</button>
      <a href="index.html" style="margin-left:auto;color:var(--sub);font-size:12.5px;align-self:center">返回设备列表</a>
    </div>
    <div class="hint" id="msg"></div>
    <div class="err" id="err"></div>
    <div id="dry" style="margin-top:14px;overflow-x:auto"></div>
  </div>
</div>

<script>
const SUPA = 'https://console-8f2c1a.pages.dev/api/supa';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjbnNzeWlxaXR1Z3FmbWNiZGhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDEyNzUsImV4cCI6MjA5ODk3NzI3NX0.9EfbEr7BQhZtbOwHJ3IrkOy16kcaxlmzuJuV0A2Z8Eg';
let token = sessionStorage.getItem('dm_token') || '';

async function login(){
  const err = document.getElementById('loginErr'); err.textContent = '';
  try{
    const r = await fetch(SUPA + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{apikey:ANON,'Content-Type':'application/json'},
      body: JSON.stringify({email: document.getElementById('email').value.trim(), password: document.getElementById('pass').value})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error_description || j.msg || '登录失败');
    token = j.access_token; sessionStorage.setItem('dm_token', token);
    showEdit();
  }catch(e){ err.textContent = '登录失败：' + e.message; }
}

function showEdit(){
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('editCard').classList.remove('hidden');
  load();
}

async function api(path, opt){
  const r = await fetch(SUPA + path, Object.assign({}, opt, {
    headers: Object.assign({apikey:ANON, Authorization:'Bearer '+token, 'Content-Type':'application/json'}, (opt&&opt.headers)||{})
  }));
  const t = await r.text();
  if(!r.ok) throw new Error(t.slice(0,180));
  return t ? JSON.parse(t) : [];
}

async function load(){
  const msg = document.getElementById('msg'), err = document.getElementById('err');
  msg.textContent = '读取中…'; err.textContent = '';
  try{
    const rows = await api('/rest/v1/dm_settings?key=eq.rules&select=value');
    document.getElementById('rules').value = rows.length ? JSON.stringify(JSON.parse(rows[0].value), null, 2) : '{"rules":[]}';
    msg.textContent = '已加载';
  }catch(e){ msg.textContent=''; err.textContent = '读取失败：' + e.message; }
}

function check(){
  const err = document.getElementById('err'), msg = document.getElementById('msg');
  err.textContent='';
  try{ JSON.parse(document.getElementById('rules').value); msg.textContent='JSON 合法'; }
  catch(e){ msg.textContent=''; err.textContent = 'JSON 错误：' + e.message; }
}

async function save(){
  const err = document.getElementById('err'), msg = document.getElementById('msg');
  err.textContent = '';
  let val;
  try{ val = JSON.parse(document.getElementById('rules').value); }
  catch(e){ err.textContent = 'JSON 错误：' + e.message; return; }
  if(!val.rules || !Array.isArray(val.rules)){ err.textContent = '必须是 {"rules":[...]} 结构'; return; }
  msg.textContent = '保存中…';
  try{
    await api('/rest/v1/dm_settings?key=eq.rules', {method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify({value: JSON.stringify(val)})});
    msg.textContent = '已保存，App 下一轮心跳生效（约 2 分钟）';
  }catch(e){ msg.textContent=''; err.textContent = '保存失败：' + e.message; }
}

async function dryRun(){
  const err = document.getElementById('err'), msg = document.getElementById('msg'), box = document.getElementById('dry');
  err.textContent = ''; box.innerHTML = ''; msg.textContent = '拉取最近会话…';
  let rules;
  try{ rules = JSON.parse(document.getElementById('rules').value).rules || []; }
  catch(e){ err.textContent = 'JSON 错误：' + e.message; return; }
  try{
    const rows = await api('/rest/v1/dm_logs?select=nick,in_text,kind,ts&order=ts.desc&limit=100');
    const seen = new Set(); const samples = [];
    for(const r of rows){
      if(!r.in_text || !r.nick) continue;
      if(seen.has(r.nick)) continue;
      seen.add(r.nick); samples.push(r);
      if(samples.length >= 30) break;
    }
    msg.textContent = '试运行 ' + samples.length + ' 条（不发送）';
    if(!samples.length){ box.innerHTML = '<div class="hint">还没有带文本的历史记录，先在 App 里跑几轮。</div>'; return; }
    const out = samples.map(r => {
      const ctx = buildCtx(r.in_text);
      const d = evaluateRules(rules, ctx);
      return `<tr><td>${esc(r.nick)}</td><td style="max-width:360px">${esc(r.in_text.slice(0,60))}</td>
        <td>${esc(d.ruleName || '兜底')}</td><td><b>${esc(d.action)}</b></td>
        <td>${esc(d.param||'')}</td></tr>`;
    }).join('');
    box.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr><th style="text-align:left;padding:8px;border-bottom:1px solid #e5e7eb">会话</th>
      <th style="text-align:left;padding:8px;border-bottom:1px solid #e5e7eb">最后消息</th>
      <th style="text-align:left;padding:8px;border-bottom:1px solid #e5e7eb">命中规则</th>
      <th style="text-align:left;padding:8px;border-bottom:1px solid #e5e7eb">动作</th>
      <th style="text-align:left;padding:8px;border-bottom:1px solid #e5e7eb">参数</th></tr></thead>
      <tbody>${out}</tbody></table>`;
  }catch(e){ msg.textContent=''; err.textContent = '试运行失败：' + e.message; }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildCtx(text){
  const now = new Date();
  return {
    text: text, unread: 1, lastFromMe: false, hour: now.getHours(),
    weekday: now.getDay()+1, wordCount: text.length,
    hasContact: /1[3-9]\d{9}/.test(text) || /(微信|vx|wx|v信)\s*[:：]?\s*[a-zA-Z0-9_-]{5,}/i.test(text) || /(https?:\/\/|www\.)/i.test(text),
    hasQuestion: /[?？]|(吗|呢|怎么|多少|哪|什么)/.test(text),
    hasForbidden: /(投诉|退款|律师|报警|曝光|起诉)/.test(text),
    isFirstChat: false, todayReplied: 0, totalReplied: 0, msgType: 'text',
    conversationState: 'ongoing', urgency: 0, topic: '', tags: []
  };
}

function evalLeaf(leaf, ctx){
  const raw = ctx[leaf.field];
  const v = leaf.value;
  switch((leaf.op||'eq').toLowerCase()){
    case 'eq': return String(raw).toLowerCase() === String(v).toLowerCase();
    case 'ne': return String(raw).toLowerCase() !== String(v).toLowerCase();
    case 'contains': return String(raw).toLowerCase().includes(String(v).toLowerCase());
    case 'not_contains': return !String(raw).toLowerCase().includes(String(v).toLowerCase());
    case 'regex': try{ return new RegExp(String(v)).test(String(raw)); }catch(e){ return false; }
    case 'gt': return Number(raw) > Number(v);
    case 'lt': return Number(raw) < Number(v);
    case 'in': return Array.isArray(v) ? v.map(String).includes(String(raw)) : false;
    case 'empty': return raw==null || raw==='' || (Array.isArray(raw)&&!raw.length);
    case 'not_empty': return !(raw==null || raw==='' || (Array.isArray(raw)&&!raw.length));
    default: return false;
  }
}

function evalCond(c, ctx){
  if(!c) return true;
  if(c.all) return c.all.every(x => evalCond(x, ctx));
  if(c.any) return c.any.some(x => evalCond(x, ctx));
  if(c.not) return !evalCond(c.not, ctx);
  if(c.field) return evalLeaf(c, ctx);
  return true;
}

function evaluateRules(rules, ctx){
  const sorted = rules.filter(r => r.enabled !== false)
    .map((r,i) => ({r, i}))
    .sort((a,b) => (Number(b.r.priority)||0) - (Number(a.r.priority)||0) || a.i - b.i)
    .map(x => x.r);
  for(const r of sorted){
    const when = r.when || r.conditions;
    if(evalCond(when, ctx)) return {ruleName: r.name || r.id, action: r.action, param: r.param || r.actionParam || ''};
  }
  return {ruleName:'', action:'wait', param:'30'};
}

if(token) showEdit();
</script>
</body>
</html>
